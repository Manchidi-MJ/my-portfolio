<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Magaseng John Manchidi</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b1220'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='54' font-weight='700' text-anchor='middle' fill='%23e8b64c'%3EMJ%3C/text%3E%3C/svg%3E" />
    <style>
        :root { --bg:#0b1220; --surface:#121d38; --border:#243356; --text:#e7ecf5; --muted:#9fb0cd; --gold:#e8b64c; --blue:#4c8dff; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
            font-family:'Inter',system-ui,Segoe UI,Roboto,sans-serif; text-align:center; padding:24px;
            background-image:radial-gradient(1000px 500px at 70% -10%, rgba(76,141,255,0.16), transparent 60%); }
        .code { font-size:clamp(5rem,20vw,9rem); font-weight:800; line-height:1;
            background:linear-gradient(135deg,var(--blue),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
        h1 { font-size:1.6rem; margin:10px 0 12px; }
        p { color:var(--muted); max-width:460px; margin:0 auto 28px; }
        a { display:inline-flex; align-items:center; gap:8px; text-decoration:none; padding:13px 26px; border-radius:50px;
            background:linear-gradient(135deg,var(--blue),#2f6fe0); color:#fff; font-weight:600; }
        a:hover { transform:translateY(-2px); }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or may have moved. Let's get you back to the portfolio.</p>
        <a href="/my-portfolio/">&larr; Back to home</a>
    </main>
</body>
</html>
