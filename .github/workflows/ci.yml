name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build, content & privacy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check JavaScript
        run: |
          node --check script.js
          for f in scripts/*.mjs; do node --check "$f"; done

      - name: Build dist/
        run: node scripts/build.mjs

      - name: Content & privacy check (source + built dist/)
        # Hard-fails on the student/phone number anywhere. [CONFIRM] only warns in
        # source; the deployed dist/ must be free of [CONFIRM] (checked --strict below).
        run: |
          node scripts/check-content.mjs
          ( cd dist && node ../scripts/check-content.mjs --strict )

      - name: Internal link & asset check
        run: node scripts/check-links.mjs index.html 404.html

      - name: Install poppler-utils (pdftotext / pdfinfo / strings via binutils)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils binutils

      - name: PDF privacy scan (pdftotext + pdfinfo plain + strings)
        run: |
          set -euo pipefail
          # Single source of truth: build one ERE from FORBIDDEN in check-content.mjs.
          REGEX="$(node -e "import('./scripts/check-content.mjs').then(m=>{console.log(m.FORBIDDEN.map(f=>f.re.source).join('|'))})")"
          echo "Using privacy regex from check-content.mjs"
          shopt -s nullglob globstar
          pdfs=( **/*.pdf )
          if [ ${#pdfs[@]} -eq 0 ]; then
            echo "No PDFs committed — nothing to scan."
            exit 0
          fi
          fail=0
          for f in "${pdfs[@]}"; do
            echo "::group::Scanning $f"
            # pdfinfo (plain) includes the Info dictionary: Title/Author/Subject/Keywords.
            info="$(pdfinfo "$f" 2>/dev/null || true)"
            text="$(pdftotext -enc UTF-8 "$f" - 2>/dev/null || true)"
            strs="$(strings -n 6 "$f" 2>/dev/null || true)"
            if printf '%s\n%s\n%s' "$info" "$text" "$strs" | grep -Eq "$REGEX"; then
              echo "::error file=$f::forbidden value (student or phone number) found in PDF"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "PDF privacy scan FAILED — do not publish."
            exit 1
          fi
          echo "PDF privacy scan passed."

      - name: Upload Pages artifact (dist only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  lighthouse:
    name: Lighthouse (mobile, non-blocking)
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build dist/
        run: node scripts/build.mjs
      - name: Serve dist/ and run Lighthouse
        continue-on-error: true
        run: |
          npx --yes http-server dist -p 8080 &
          sleep 3
          npx --yes lighthouse http://localhost:8080 \
            --preset=desktop --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox" \
            --output=json --output-path=./lh.json --quiet || true
          node -e "try{const r=require('./lh.json');const c=r.categories;console.log('Lighthouse:',Object.keys(c).map(k=>k+' '+Math.round(c[k].score*100)).join(' | '))}catch(e){console.log('Lighthouse run skipped/failed (non-blocking).')}"
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lh.json
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
